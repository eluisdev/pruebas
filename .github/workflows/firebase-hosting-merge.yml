name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4 # Actualizado a la versión 4

      - name: Setup Node.js
        uses: actions/setup-node@v3 # Actualizado a la versión 3
        with:
          node-version: 20
          cache: "npm" # Agregado para caching de dependencias

      - name: Install Dependencies
        run: npm ci # Cambiado a npm ci para instalación limpia

      - name: Build
        run: npm run build

      - name: Verify Build Output
        run: |
          echo "Contenido del directorio:"
          ls -la
          echo "Contenido de dist/:"
          ls -la dist/

      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: firebase-deploy
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRUEBAS_DA489 }}"
          projectId: pruebas-da489
          channelId: live
          expires: "2h"

      - name: Comentar URL del Preview en el PR
        if: success()
        run: |
          echo "🔗 Preview listo en: ${{ steps.firebase-hosting-deploy.outputs.details_url }}"