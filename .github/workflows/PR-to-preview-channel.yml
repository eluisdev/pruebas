name: Deploy to Firebase Hosting on PR to pruebas
on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - development
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  build_and_preview:
    if: "${{ github.event.pull_request.head.repo.full_name == github.repository }}"
    runs-on: ubuntu-latest
    environment: development

